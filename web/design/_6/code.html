<!-- Top App Bar (Transactional variant - no nav links) -->
<header class="fixed top-0 left-0 w-full z-50 flex justify-between items-center px-margin-sm h-16 max-w-container-max-width mx-auto backdrop-blur-md bg-transparent">
<button aria-label="Go back" class="p-2 rounded-full hover:bg-surface-container-high transition-colors flex items-center justify-center text-primary">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">arrow_back</span>
</button>
<div class="flex-1"></div>
</header>
<!-- Main Content Area -->
<main class="flex-1 w-full max-w-container-max-width mx-auto px-margin-sm pt-24 pb-32 flex flex-col items-center">
<!-- Header Section -->
<div class="w-full text-center mb-margin-lg">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-primary mb-margin-xs">
                다시 만났네요
            </h1>
<p class="font-body-md text-body-md text-on-surface-variant">
                로그인할 이메일을 입력해주세요
            </p>
</div>
<!-- Input Section -->
<div class="w-full max-w-md">
<div class="relative group">
<input class="w-full bg-surface-container-lowest border-2 border-outline/50 rounded-xl px-4 py-4 font-body-lg text-body-lg text-on-surface placeholder:text-on-surface-variant/50 focus:outline-none focus:border-primary focus:ring-0 transition-colors bg-white shadow-[0_4px_20px_0_rgba(147,74,46,0.04)]" id="email" placeholder="이메일 주소" type="email"/>
</div>
<!-- Optional: Illustration for empty state/ambiance -->
<div class="mt-margin-lg flex justify-center opacity-70 pointer-events-none">
<span class="material-symbols-outlined text-tertiary-container" style="font-size: 64px; font-variation-settings: 'FILL' 0, 'wght' 200;">mail</span>
</div>
</div>
</main>
<!-- Fixed Bottom Action -->
<div class="fixed bottom-0 left-0 w-full p-margin-sm z-40 flex justify-center">
<div class="w-full max-w-container-max-width">
<button class="w-full bg-primary text-on-primary font-title-md text-title-md rounded-xl py-4 flex items-center justify-center hover:opacity-90 active:scale-95 transition-all duration-200 shadow-sm">
                인증 코드 받기
            </button>
</div>
</div>
<!-- Script for basic interaction -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const emailInput = document.getElementById('email');
            
            // Auto-focus the input for a better transactional experience
            setTimeout(() => {
                emailInput.focus();
            }, 300);
        });
