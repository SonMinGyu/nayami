<!-- Micro-interaction JS for OTP -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const inputs = document.querySelectorAll('.otp-input');
            const confirmBtn = document.getElementById('confirm-btn');

            // Auto focus first input
            inputs[0].focus();

            inputs.forEach((input, index) => {
                // Handle input
                input.addEventListener('input', (e) => {
                    const value = e.target.value;
                    
                    // Only allow numbers, restrict to length 1
                    if (!/^\d*$/.test(value)) {
                        e.target.value = '';
                        return;
                    }
                    if (value.length > 1) {
                        e.target.value = value.slice(-1);
                    }

                    // Move to next input if filled
                    if (e.target.value !== '') {
                        input.classList.add('border-primary'); // Visual cue for filled
                        input.classList.remove('border-outline-variant');
                        
                        if (index < inputs.length - 1) {
                            inputs[index + 1].disabled = false;
                            inputs[index + 1].focus();
                        }
                    } else {
                        input.classList.remove('border-primary');
                        input.classList.add('border-outline-variant');
                    }

                    checkAllFilled();
                });

                // Handle backspace
                input.addEventListener('keydown', (e) => {
                    if (e.key === 'Backspace') {
                        if (e.target.value === '') {
                            // If empty, move to previous and clear it
                            if (index > 0) {
                                inputs[index - 1].focus();
                                inputs[index - 1].value = '';
                                inputs[index - 1].classList.remove('border-primary');
                                inputs[index - 1].classList.add('border-outline-variant');
                                // Re-disable current if moving back
                                input.disabled = true;
                            }
                        } else {
                            // Clear current input styling on backspace
                            input.classList.remove('border-primary');
                            input.classList.add('border-outline-variant');
                        }
                        checkAllFilled();
                    }
                });

                // Handle Paste (Bonus usability)
                input.addEventListener('paste', (e) => {
                    e.preventDefault();
                    const pastedData = e.clipboardData.getData('text').trim();
                    if (!/^\d+$/.test(pastedData)) return; // Only paste numbers

                    const digits = pastedData.split('').slice(0, inputs.length);
                    
                    digits.forEach((digit, i) => {
                        if (i < inputs.length) {
                            inputs[i].disabled = false;
                            inputs[i].value = digit;
                            inputs[i].classList.add('border-primary');
                            inputs[i].classList.remove('border-outline-variant');
                        }
                    });
                    
                    // Focus the next empty input or the last one
                    const nextEmptyIndex = digits.length < inputs.length ? digits.length : inputs.length - 1;
                    inputs[nextEmptyIndex].focus();
                    
                    checkAllFilled();
                });
            });

            function checkAllFilled() {
                let allFilled = true;
                inputs.forEach(input => {
                    if (input.value === '') {
                        allFilled = false;
                    }
                });
                
                if (allFilled) {
                    confirmBtn.disabled = false;
                    // Optional: subtle bump effect on button when ready
                    confirmBtn.classList.add('scale-[1.02]');
                    setTimeout(() => confirmBtn.classList.remove('scale-[1.02]'), 200);
                } else {
                    confirmBtn.disabled = true;
                }
            }
        });
    </script>
