<div class="flex-1 flex flex-col px-margin-sm pt-margin-lg pb-[120px] overflow-y-auto z-10">
<!-- Typography Headers -->
<div class="flex flex-col gap-2 mb-10">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile md:font-display-lg md:text-display-lg text-on-background tracking-tight">
                    반가워요!
                </h1>
<p class="font-body-lg text-body-lg text-on-surface-variant">
                    가입할 이메일을 입력해주세요
                </p>
</div>
<!-- Input Form Area -->
<div class="flex flex-col w-full">
<label class="sr-only" for="email-input">이메일 주소</label>
<div class="relative flex items-center group">
<input class="w-full bg-surface-container-lowest border border-outline/40 rounded-xl px-4 py-4 font-body-md text-body-md text-on-background placeholder:text-outline focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all duration-300 shadow-[0_4px_20px_0_rgba(147,74,46,0.02)] group-focus-within:shadow-[0_8px_30px_0_rgba(147,74,46,0.06)]" id="email-input" placeholder="email@example.com" type="email"/>
</div>

<span class="">인증 코드 받기</span>

<script>
        // Optional micro-interaction: Focus input on load for immediate typing readiness on desktop, 
        // but maybe omit on mobile to prevent unwanted keyboard popups immediately.
        document.addEventListener('DOMContentLoaded', () => {
            const emailInput = document.getElementById('email-input');
            // Simple check to focus only on wider screens where keyboard isn't as intrusive
            if (window.innerWidth > 768 && emailInput) {
                setTimeout(() => emailInput.focus(), 300);
            }
        });
    </script>
