<style>
        body {
            background-color: theme('colors.background');
            color: theme('colors.on-background');
        }
        /* Soft, minimal focus ring for inputs */
        input:focus {
            box-shadow: 0 0 0 2px theme('colors.primary');
            outline: none;
            border-color: theme('colors.primary');
        }
    </style>

<body class="antialiased min-h-screen flex flex-col items-center justify-center selection:bg-primary-container selection:text-on-primary-container bg-white/40" style='background-image: url("https://lh3.googleusercontent.com/aida/ADBb0ugxm16ns6CzrqZTQxJA0p0a5P0vZX-wukPVisNqIpNTP6EJM51Z-NIJ6Uaxl2aSMB6KoP8yQufVLioR9xT3tYdShSesuIDEe4ooI09vPNbUpKja8GJFWGo_Fzz7J7TJIYOwtWp1bsFc41vD_Yh2qag-5g1esNLtVq9KVNFIdYihlm4bt0W5fDylYuR3PedIlWMFvrOQmjpR6NBO87L2xWtcjn1Ywyy_miFGJrTWVeZK-l8gexIwiMot8UY"); background-size: cover; background-position: center center; background-repeat: no-repeat; background-attachment: fixed;'>
<!-- Main Container - Fixed Grid / Narrow column for focus -->
<main class="w-full max-w-container-max-width px-margin-sm md:px-margin-md flex-1 flex flex-col relative h-screen">
<!-- Top App Bar - Simple back navigation (Transactional Page - no global nav) -->
<header class="w-full py-margin-sm flex items-center justify-start absolute top-0 left-0 px-margin-sm md:px-margin-md">
<button aria-label="Go back" class="text-on-surface-variant hover:text-primary transition-colors flex items-center justify-center p-2 rounded-full hover:bg-surface-container-high">
<span class="material-symbols-outlined text-2xl">arrow_back</span>
</button>
</header>
<!-- Content Canvas -->
<div class="flex-1 flex flex-col justify-center max-w-[400px] w-full mx-auto pt-24 pb-32">
<div class="space-y-unit mb-margin-lg text-center md:text-left">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-on-background">어떻게 불러드릴까요?</h1>
<p class="font-body-md text-body-md text-on-surface-variant mt-2">나야미에서 사용할 편안한 이름을 지어주세요.</p>
</div>
<!-- Input Group -->
<div class="space-y-2 relative">
<div class="relative">
<input autocomplete="off" class="w-full bg-surface-container-lowest border border-outline rounded-lg px-4 py-4 font-body-lg text-body-lg text-on-background placeholder-on-surface-variant/50 transition-all duration-200" id="nickname" placeholder="닉네임 입력" type="text"/>
</div>
<!-- Validation Message (Hidden by default, toggled via JS for demo) -->
<div class="flex items-center gap-1 font-label-sm text-label-sm opacity-0 transition-opacity duration-300 min-h-[20px]" id="validation-msg">
<span class="material-symbols-outlined text-[16px] icon-span"></span>
<span class="text-span"></span>
</div>
</div>
<!-- Decorative Illustration / Spacer -->
<div class="flex-1 min-h-[100px] flex items-center justify-center mt-margin-md opacity-20 pointer-events-none">
<span class="material-symbols-outlined text-6xl text-primary" style="font-variation-settings: 'FILL' 0;">mail</span>
</div>
</div>
<!-- Fixed Bottom Action Area -->
<div class="fixed bottom-0 left-0 w-full p-margin-sm md:p-margin-md flex justify-center to-transparent pb-8 bg-transparent">
<button class="w-full max-w-[400px] h-[56px] bg-primary text-on-primary font-title-md text-title-md rounded-full shadow-sm hover:shadow-md hover:-translate-y-[1px] disabled:opacity-50 disabled:hover:translate-y-0 disabled:shadow-none transition-all duration-300 flex items-center justify-center" disabled="" id="submit-btn">
                가입 완료
            </button>
</div>
</main>
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const input = document.getElementById('nickname');
            const validationMsg = document.getElementById('validation-msg');
            const iconSpan = validationMsg.querySelector('.icon-span');
            const textSpan = validationMsg.querySelector('.text-span');
            const submitBtn = document.getElementById('submit-btn');

            // Simple demo logic for validation
            input.addEventListener('input', (e) => {
                const val = e.target.value.trim();
                
                if (val.length === 0) {
                    validationMsg.style.opacity = '0';
                    submitBtn.disabled = true;
                    input.classList.remove('border-error', 'border-success', 'focus:border-error', 'focus:border-success');
                    input.classList.add('border-outline');
                    return;
                }

                validationMsg.style.opacity = '1';

                // Mock validation: if it contains 'admin' it's taken, else it's free
                if (val.toLowerCase().includes('admin')) {
                    // Invalid state
                    iconSpan.textContent = 'error';
                    iconSpan.className = 'material-symbols-outlined text-[16px] icon-span text-error';
                    textSpan.textContent = '이미 사용 중인 닉네임입니다';
                    textSpan.className = 'text-span text-error';
                    
                    input.classList.remove('border-outline', 'border-success', 'focus:border-success');
                    input.classList.add('border-error', 'focus:border-error');
                    submitBtn.disabled = true;
                } else {
                    // Valid state
                    iconSpan.textContent = 'check_circle';
                    iconSpan.className = 'material-symbols-outlined text-[16px] icon-span text-success';
                    textSpan.textContent = '사용 가능한 닉네임입니다';
                    textSpan.className = 'text-span text-success';
                    
                    input.classList.remove('border-outline', 'border-error', 'focus:border-error');
                    input.classList.add('border-success', 'focus:border-success');
                    submitBtn.disabled = false;
                }
            });
        });
    </script>
</body></html>
