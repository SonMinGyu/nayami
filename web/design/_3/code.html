<body class="bg-surface text-on-surface min-h-screen flex flex-col font-body-md antialiased selection:bg-primary-container selection:text-on-primary-container"><div class="fixed inset-0 z-[-1] pointer-events-none opacity-80" style='background-image: url("https://lh3.googleusercontent.com/aida/ADBb0ugxm16ns6CzrqZTQxJA0p0a5P0vZX-wukPVisNqIpNTP6EJM51Z-NIJ6Uaxl2aSMB6KoP8yQufVLioR9xT3tYdShSesuIDEe4ooI09vPNbUpKja8GJFWGo_Fzz7J7TJIYOwtWp1bsFc41vD_Yh2qag-5g1esNLtVq9KVNFIdYihlm4bt0W5fDylYuR3PedIlWMFvrOQmjpR6NBO87L2xWtcjn1Ywyy_miFGJrTWVeZK-l8gexIwiMot8UY"); background-size: cover; background-position: center center; background-repeat: no-repeat;'></div>
<!-- TopAppBar -->
<header class="fixed top-0 left-0 w-full z-50 flex justify-between items-center px-margin-sm h-16 max-w-container-max-width mx-auto bg-surface/80 dark:bg-surface/80 backdrop-blur-md">
<button aria-label="Go back" class="w-12 h-12 flex items-center justify-start text-on-surface-variant hover:opacity-80 transition-opacity">
<span class="material-symbols-outlined" style="font-size: 24px;">arrow_back</span>
</button>
<div class="flex-1 flex justify-center">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-primary font-bold">고민 던지기</h1>
</div>
<div class="w-12 h-12"></div> <!-- Spacer for centering -->
</header>
<!-- Main Content Canvas -->
<main class="flex-1 flex flex-col w-full max-w-container-max-width mx-auto px-margin-sm pt-[80px] pb-[100px] relative">
<!-- Writing Area Container -->
<div class="flex-1 flex flex-col bg-surface-container-lowest rounded-xl ambient-shadow p-6 md:p-8 relative">
<textarea class="w-full h-full flex-1 bg-transparent border-none focus:ring-0 resize-none font-body-lg text-body-lg text-on-surface placeholder:text-outline/60 outline-none" id="worryInput" maxlength="500" placeholder="오늘 어떤 고민이 있으신가요? 편하게 적어보세요..."></textarea>
<div class="absolute bottom-6 right-6 flex items-center justify-end">
<span class="font-label-sm text-label-sm text-on-surface-variant/70" id="charCount">
                    0/500
                </span>
</div>
</div>
</main>
<!-- Fixed Bottom Action Area -->
<div class="fixed bottom-0 left-0 w-full z-40 bg-gradient-to-t from-surface via-surface to-transparent pt-8 pb-6 px-margin-sm max-w-container-max-width left-1/2 -translate-x-1/2">
<button class="w-full h-12 md:h-14 bg-primary text-on-primary rounded-full font-title-md text-title-md flex items-center justify-center hover:bg-surface-tint transition-all active:scale-95 shadow-md">
            던지기
        </button>
</div>
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const textarea = document.getElementById('worryInput');
            const charCount = document.getElementById('charCount');

            textarea.addEventListener('input', () => {
                const currentLength = textarea.value.length;
                charCount.textContent = `${currentLength}/500`;
            });
            
            // Auto focus on load for immediate writing
            textarea.focus();
        });
    </script>
