<body class="bg-background text-on-background font-body-md text-body-md antialiased min-h-screen relative selection:bg-primary-container selection:text-on-primary-container">
<!-- TopAppBar -->
<div class="fixed inset-0 pointer-events-none z-[-1] opacity-20 bg-center bg-cover bg-no-repeat" style="background-image: url('https://lh3.googleusercontent.com/aida/ADBb0ugxm16ns6CzrqZTQxJA0p0a5P0vZX-wukPVisNqIpNTP6EJM51Z-NIJ6Uaxl2aSMB6KoP8yQufVLioR9xT3tYdShSesuIDEe4ooI09vPNbUpKja8GJFWGo_Fzz7J7TJIYOwtWp1bsFc41vD_Yh2qag-5g1esNLtVq9KVNFIdYihlm4bt0W5fDylYuR3PedIlWMFvrOQmjpR6NBO87L2xWtcjn1Ywyy_miFGJrTWVeZK-l8gexIwiMot8UY'); opacity: 0.4;"></div><header class="fixed top-0 left-0 w-full z-50 flex justify-between items-center px-margin-sm h-16 max-w-container-max-width mx-auto bg-surface/80 backdrop-blur-md">
<div class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-primary tracking-tight">
            Nayami
        </div>
<div class="flex items-center gap-2">
<button aria-label="Profile and Logout" class="w-10 h-10 flex items-center justify-center rounded-full text-on-surface-variant hover:bg-surface-container-highest transition-colors">
<span class="material-symbols-outlined" style="font-size: 28px;">account_circle</span>
</button>
</div>
</header>
<!-- Main Content Canvas -->
<main class="max-w-container-max-width mx-auto pt-28 pb-32 px-margin-sm md:px-margin-md flex flex-col items-center">
<!-- Greeting Section -->
<section class="w-full text-center mb-margin-lg mt-margin-md">
<h1 class="font-display-lg text-display-lg text-on-surface mb-2 animate-fade-in-up">
                안녕하세요, <span class="text-primary">익명</span>님
            </h1>
<p class="font-body-lg text-body-lg text-on-surface-variant max-w-md mx-auto">
                오늘 하루도 수고 많으셨어요.<br/>이곳에서 편안하게 마음을 나누어 보세요.
            </p>
</section>
<!-- Interactive Cards Grid -->
<div class="w-full grid grid-cols-1 md:grid-cols-2 gap-gutter max-w-2xl">
<!-- Card 1: Throw Worries -->
<button class="group w-full bg-surface-container-lowest rounded-[32px] p-8 md:p-10 flex flex-col items-center text-center text-left shadow-[0_4px_24px_0_rgba(147,74,46,0.04)] hover:shadow-[0_12px_40px_0_rgba(147,74,46,0.08)] hover:-translate-y-1 transition-all duration-300 ease-out border border-transparent hover:border-primary-container/20" style="opacity: 1; transform: translateY(0px); transition: opacity 0.6s ease-out, transform 0.6s ease-out;">
<div class="w-20 h-20 rounded-full bg-surface-container-high group-hover:bg-primary-container/20 flex items-center justify-center mb-6 transition-colors duration-300">
<span class="material-symbols-outlined text-primary" style="font-size: 36px; font-variation-settings: 'FILL' 1;">mail</span>
</div>
<h2 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface mb-3 group-hover:text-primary transition-colors">
                    고민 던지기
                </h2>
<p class="font-body-md text-body-md text-on-surface-variant">
                    마음속 무거운 고민을 편지지에 담아<br class="hidden md:block"/> 조용히 털어놓아 보세요.
                </p>
</button>
<!-- Card 2: Listen to Worries -->
<button class="group w-full bg-surface-container-lowest rounded-[32px] p-8 md:p-10 flex flex-col items-center text-center shadow-[0_4px_24px_0_rgba(147,74,46,0.04)] hover:shadow-[0_12px_40px_0_rgba(147,74,46,0.08)] hover:-translate-y-1 transition-all duration-300 ease-out border border-transparent hover:border-tertiary-container/30" style="opacity: 1; transform: translateY(0px); transition: opacity 0.6s ease-out, transform 0.6s ease-out;">
<div class="w-20 h-20 rounded-full bg-surface-container-high group-hover:bg-tertiary-container/20 flex items-center justify-center mb-6 transition-colors duration-300">
<span class="material-symbols-outlined text-tertiary" style="font-size: 36px; font-variation-settings: 'FILL' 1;">hearing</span>
</div>
<h2 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface mb-3 group-hover:text-tertiary transition-colors">
                    고민 들어주기
                </h2>
<p class="font-body-md text-body-md text-on-surface-variant">
                    누군가의 익명 편지를 읽고<br class="hidden md:block"/> 따뜻한 위로의 답장을 보내주세요.
                </p>
</button>
</div>
<!-- Decorative Element -->
<div class="mt-margin-lg opacity-30 pointer-events-none">
<span class="material-symbols-outlined text-primary/40" style="font-size: 48px;">local_florist</span>
</div>
</main>
<!-- BottomNavBar (Mobile Only as per guidelines) -->
<nav class="md:hidden fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-margin-sm pb-4 pt-2 bg-surface/90 backdrop-blur-xl shadow-[0_-4px_20px_0_rgba(147,74,46,0.04)] rounded-t-2xl">
<!-- Home (Active) -->
<button class="flex flex-col items-center justify-center bg-primary-container text-on-primary-container rounded-full px-6 py-2 scale-100 transition-all duration-300 ease-out">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">home</span>
<span class="font-label-sm text-label-sm mt-1">Home</span>
</button>
<!-- Worry (Inactive) -->
<button class="flex flex-col items-center justify-center text-on-surface-variant px-5 py-2 hover:bg-surface-container-high transition-colors rounded-2xl">
<span class="material-symbols-outlined">edit_note</span>
<span class="font-label-sm text-label-sm mt-1">Worry</span>
</button>
<!-- Profile (Inactive) -->
<button class="flex flex-col items-center justify-center text-on-surface-variant px-5 py-2 hover:bg-surface-container-high transition-colors rounded-2xl">
<span class="material-symbols-outlined">person</span>
<span class="font-label-sm text-label-sm mt-1">Profile</span>
</button>
</nav>
<!-- Simple JS for entrance animation -->
<script>
        document.addEventListener("DOMContentLoaded", () => {
            const cards = document.querySelectorAll('.grid > button');
            cards.forEach((card, index) => {
                card.style.opacity = '0';
                card.style.transform = 'translateY(20px)';
                card.style.transition = 'opacity 0.6s ease-out, transform 0.6s ease-out';
                
                setTimeout(() => {
                    card.style.opacity = '1';
                    card.style.transform = 'translateY(0)';
                }, 150 + (index * 150));
            });
        });
    </script>
</body></html>
