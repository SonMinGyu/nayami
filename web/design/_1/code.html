<style>

<body class="text-on-surface antialiased flex flex-col min-h-screen relative font-body-md"><div class="fixed inset-0 z-0 pointer-events-none opacity-40">
<img alt="" class="w-full h-full object-cover" src="https://lh3.googleusercontent.com/aida/ADBb0ugxm16ns6CzrqZTQxJA0p0a5P0vZX-wukPVisNqIpNTP6EJM51Z-NIJ6Uaxl2aSMB6KoP8yQufVLioR9xT3tYdShSesuIDEe4ooI09vPNbUpKja8GJFWGo_Fzz7J7TJIYOwtWp1bsFc41vD_Yh2qag-5g1esNLtVq9KVNFIdYihlm4bt0W5fDylYuR3PedIlWMFvrOQmjpR6NBO87L2xWtcjn1Ywyy_miFGJrTWVeZK-l8gexIwiMot8UY"/>

<!-- TopAppBar -->
<!-- Suppressed navigation shell (BottomNavBar) as this is a focused task/transactional screen with a "Back" action -->
<header class="fixed top-0 left-0 w-full z-50 flex justify-between items-center px-margin-sm h-16 max-w-container-max-width mx-auto bg-surface/80 dark:bg-surface/80 backdrop-blur-md z-10">
<button class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-surface-container transition-colors text-on-surface-variant">
<span class="material-symbols-outlined" style="font-variation-settings: 'wght' 300;">arrow_back</span>
</button>
<h1 class="font-title-md text-title-md text-on-surface">고민 들어주기</h1>
<div class="w-10 h-10"></div> <!-- Spacer for centering -->
</header>
<!-- Main Content Canvas -->
<main class="flex-grow w-full max-w-container-max-width mx-auto px-margin-sm pt-24 pb-32 flex flex-col items-center relative z-10">
<!-- Worry Card (The "Letter") -->
<article class="w-full bg-surface-container-lowest rounded-xl p-8 mb-margin-md ambient-shadow flex flex-col max-h-[40vh] overflow-y-auto">
<div class="flex items-center gap-3 mb-6 opacity-80">
<div class="w-8 h-8 rounded-full bg-secondary-fixed flex items-center justify-center text-secondary">
<span class="material-symbols-outlined text-[18px]">person</span>
</div>
<span class="font-label-sm text-label-sm text-on-surface-variant">익명의 누군가</span>
<span class="font-label-sm text-label-sm text-outline-variant ml-auto">오늘</span>
</div>
<p class="font-body-lg text-body-lg text-on-surface whitespace-pre-wrap leading-relaxed">
요즘 들어 자꾸만 무기력해지는 기분이에요. 
아침에 일어나는 것도 힘들고, 예전에는 좋아했던 일들에도 흥미가 생기지 않네요. 

주변 사람들에게 말하기엔 다들 각자의 삶이 바빠 보여서 부담을 주고 싶지 않았어요. 
그냥 이렇게라도 누군가에게 털어놓으면 조금 나아질까 싶어 적어봅니다. 

제가 너무 약한 걸까요? 다시 예전처럼 활기차게 지낼 수 있을지 모르겠어요.
            </p>
</article>
<!-- Visual Separator -->
<div class="w-full flex items-center justify-center mb-margin-md opacity-30">
<div class="h-px bg-outline-variant flex-grow"></div>
<span class="material-symbols-outlined mx-4 text-outline" style="font-variation-settings: 'FILL' 1;">favorite</span>
<div class="h-px bg-outline-variant flex-grow"></div>
</div>
<!-- Reply Area -->
<section class="w-full flex-grow flex flex-col relative">
<label class="sr-only" for="reply-content">답장 작성</label>
<textarea class="w-full flex-grow min-h-[200px] bg-transparent border-0 resize-none font-body-lg text-body-lg text-on-surface placeholder:text-outline-variant focus:ring-0 p-0 leading-relaxed" id="reply-content" placeholder="따뜻한 한마디를 건네보세요..."></textarea>
<!-- Contextual Illustration / Watermark -->
<div class="absolute bottom-4 right-4 opacity-10 pointer-events-none flex flex-col items-center">
<span class="material-symbols-outlined text-[64px] text-primary">mail</span>
</div>
</section>
</main>
<!-- Fixed Bottom Button -->
<div class="fixed bottom-0 left-0 w-full bg-gradient-to-t from-surface via-surface to-transparent pt-12 pb-6 px-margin-sm z-40">
<div class="max-w-container-max-width mx-auto">
<button class="w-full h-14 bg-primary text-on-primary font-title-md text-title-md rounded-full shadow-sm hover:shadow-md transition-shadow flex items-center justify-center gap-2 ambient-shadow">
<span class="material-symbols-outlined">send</span>
                전달하기
            </button>
</div>
</div>
<script>
        // Simple auto-resize for textarea to ensure it feels natural
        const textarea = document.getElementById('reply-content');
        textarea.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = (this.scrollHeight) + 'px';
        });
    </script>
