spring:
  application:
    name: core-service
  jpa:
    hibernate:
      ddl-auto: update
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  mail:
    host: ${MAIL_HOST:email-smtp.ap-northeast-2.amazonaws.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    from: ${MAIL_FROM:noreply@nayamiletter.com}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  cloud:
    aws:
      credentials:
        access-key: ${AWS_ACCESS_KEY_ID}
        secret-key: ${AWS_SECRET_ACCESS_KEY}
      region:
        static: ${AWS_REGION:ap-northeast-2}

sqs:
  concern-check-request-queue-url: ${SQS_CONCERN_CHECK_REQUEST_QUEUE_URL}
  concern-check-result-queue-url: ${SQS_CONCERN_CHECK_RESULT_QUEUE_URL}
  reply-check-request-queue-url: ${SQS_REPLY_CHECK_REQUEST_QUEUE_URL}
  reply-check-result-queue-url: ${SQS_REPLY_CHECK_RESULT_QUEUE_URL}
  email-notification-queue-url: ${SQS_EMAIL_NOTIFICATION_QUEUE_URL}

jwt:
  secret: ${JWT_SECRET}
  access-token-expiry: 3600000
  refresh-token-expiry: 604800000

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}