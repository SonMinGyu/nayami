spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.mail.MailSenderAutoConfiguration
  datasource:
    url: jdbc:h2:mem:nayami-test
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
  cloud:
    aws:
      credentials:
        access-key: test
        secret-key: test
      region:
        static: ap-northeast-2
      sqs:
        listener:
          auto-startup: false

sqs:
  concern-check-request-queue-url: https://sqs.ap-northeast-2.amazonaws.com/000000000000/test-concern-request
  concern-check-result-queue-url: https://sqs.ap-northeast-2.amazonaws.com/000000000000/test-concern-result
  reply-check-request-queue-url: https://sqs.ap-northeast-2.amazonaws.com/000000000000/test-reply-request
  reply-check-result-queue-url: https://sqs.ap-northeast-2.amazonaws.com/000000000000/test-reply-result
  email-notification-queue-url: https://sqs.ap-northeast-2.amazonaws.com/000000000000/test-email-notification
